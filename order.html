        const back2 = document.getElementById('backStep2'), back3 = document.getElementById('backStep3'), back4 = document.getElementById('backStep4');
        const confirmBtn = document.getElementById('confirmOrderBtn');
        const resultDiv = document.getElementById('resultMessage');

        // Fetch current user (if any) and his promo code
        async function fetchUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                currentUserId = user.id;
                const { data: cust } = await sb.from('customers').select('promo_code').eq('uid', user.id).maybeSingle();
                if (cust) currentUserPromoCode = cust.promo_code?.toString();
            }
        }
        fetchUser();

        // Validate promo code: exists and (if logged in) not owned by buyer
        async function validatePromoCode(promoCode, buyerUserId) {
            if (!promoCode) return { valid: true };
            const { data, error } = await sb.from('customers').select('id, promo_code, uid').eq('promo_code', promoCode).maybeSingle();
            if (error || !data) return { valid: false, message: 'Promo code aan jirin. Fadlan hubi.' };
            if (buyerUserId) {
                // Check if the promo code belongs to the logged-in user
                if (data.uid === buyerUserId) {
                    return { valid: false, message: "Ma isticmaali kartid promo code-kaaga. Isticmaal mid saaxiibkaaga." };
                }
            }
            return { valid: true };
        }

        function showStep(step) {
            for (let i=1;i<=4;i++) if(stepContents[i]) stepContents[i].classList.remove('active');
            if(stepContents[step]) stepContents[step].classList.add('active');
            currentStep = step;
            stepCircles.forEach((circle,idx)=>{ if(idx+1===step) circle.classList.add('active'); else circle.classList.remove('active'); });
            if(step===1 && next1) updateButtonColor(next1);
            if(step===2 && next2) updateButtonColor(next2);
            if(step===3 && next3) updateButtonColor(next3);
            if(step===4 && confirmBtn) updateButtonColor(confirmBtn);
        }

        function updateButtonColor(button) {
            if(selectedProvider && companies.find(c=>c.id===selectedProvider)?.color) {
                let col = companies.find(c=>c.id===selectedProvider).color;
                button.style.background = `linear-gradient(135deg, ${col}, ${col}cc)`;
            } else {
                button.style.background = "linear-gradient(135deg, #f59e0b, #e67e22)";
            }
        }

        function loadCompanies() {
            companyGrid.innerHTML = '';
            companies.forEach(comp => {
                const card = document.createElement('div');
                card.className = 'circle-card';
                if(selectedProvider === comp.id) card.classList.add('selected');
                card.style.backgroundColor = comp.color;
                card.innerHTML = `<div style="font-size:2rem; font-weight:bold;">${comp.letter}</div><div class="title">${comp.name}</div><div class="selected-ring"><i class="fas fa-check"></i></div>`;
                card.onclick = () => {
                    selectedProvider = comp.id;
                    selectedService = null;
                    selectedPlan = null;
                    selectedPayment = null;
                    loadCompanies();
                    next1.disabled = false;
                    updateButtonColor(next1);
                };
                companyGrid.appendChild(card);
            });
        }

        function loadServices() {
            if(!selectedProvider) return;
            const data = staticPlans[selectedProvider];
            const services = data.services;
            serviceGrid.innerHTML = '';
            services.forEach(svc => {
                const card = document.createElement('div');
                card.className = 'circle-card';
                let firstPlan = data.plans[svc]?.[0];
                let iconChar = firstPlan?.icon || "📡";
                card.style.backgroundColor = companies.find(c=>c.id===selectedProvider).color;
                card.innerHTML = `<div class="icon">${iconChar}</div><div class="title">${svc}</div><div class="selected-ring"><i class="fas fa-check"></i></div>`;
                if(selectedService === svc) { card.classList.add('selected'); card.style.borderColor = 'white'; }
                card.onclick = () => { selectedService = svc; loadServices(); next2.disabled = false; updateButtonColor(next2); };
                serviceGrid.appendChild(card);
            });
        }

        function loadPlans() {
            if(!selectedProvider || !selectedService) return;
            const data = staticPlans[selectedProvider];
            const plans = data.plans[selectedService];
            if(!plans) return;
            planGrid.innerHTML = '';
            plans.forEach(plan => {
                const card = document.createElement('div');
                card.className = 'circle-card';
                let priceHtml = '';
                if(plan.old_price) priceHtml = `<div class="price"><span class="old-price">$${plan.old_price.toFixed(2)}</span> $${plan.price.toFixed(2)}</div>`;
                else priceHtml = `<div class="price">$${plan.price.toFixed(2)}</div>`;
                let details = plan.features || '';
                if(plan.minutes) details = `${plan.minutes} daqiiqo`;
                if(plan.sms) details += ` 🔒${plan.sms}`;
                card.style.backgroundColor = companies.find(c=>c.id===selectedProvider).color;
                card.innerHTML = `<div class="icon">${plan.icon}</div><div class="title">${plan.name}</div>${priceHtml}<div class="feature-badge">${details.substring(0,20)}</div><div class="selected-ring"><i class="fas fa-check"></i></div>`;
                if(selectedPlan && selectedPlan.name === plan.name) { card.classList.add('selected'); card.style.borderColor = 'white'; }
                card.onclick = () => { selectedPlan = plan; loadPlans(); next3.disabled = false; updateButtonColor(next3); };
                planGrid.appendChild(card);
            });
        }

        function loadPaymentsAndSummary() {
            paymentDiv.innerHTML = '';
            paymentMethods.forEach(pm => {
                const card = document.createElement('div');
                card.className = 'circle-card';
                card.style.backgroundColor = pm.color;
                if(selectedPayment && selectedPayment.id === pm.id) { card.classList.add('selected'); card.style.borderColor = 'white'; }
                card.innerHTML = `<div class="icon">${pm.icon}</div><div class="title">${pm.name}</div><div class="selected-ring"><i class="fas fa-check"></i></div>`;
                card.onclick = () => { selectedPayment = pm; loadPaymentsAndSummary(); };
                paymentDiv.appendChild(card);
            });
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const summaryDiv = document.getElementById('orderSummary');
            if(selectedPlan && selectedProvider) {
                const providerName = companies.find(c=>c.id===selectedProvider).name;
                summaryDiv.innerHTML = `<strong>Qorshaha la doortay:</strong> ${selectedPlan.name} - $${selectedPlan.price}<br><strong>Shirkad:</strong> ${providerName}`;
            } else {
                summaryDiv.innerHTML = 'Marka hore dooro qorshe.';
            }
        }

        function validateSomaliPhone(phone) { return /^(\+252|0)?(61|62|63|68|69)[0-9]{7}$/.test(phone); }

        async function createOrder() {
            if(!selectedPlan || !selectedPayment) {
                alert('Fadlan dooro qorshe iyo habka bixinta.');
                return;
            }
            const sender = document.getElementById('senderPhone').value.trim();
            const receiver = document.getElementById('receiverPhone').value.trim() || sender;
            const promo = document.getElementById('promoCodeInput').value.trim();
            if(!validateSomaliPhone(sender)) {
                document.getElementById('senderError').innerText = 'Lambar khaldan (tusaale: 612345678)';
                return;
            }
            document.getElementById('senderError').innerText = '';

            // PROMO CODE VALIDATION (only registered promo codes, cannot use own)
            if(promo) {
                const validation = await validatePromoCode(promo, currentUserId);
                if(!validation.valid) {
                    alert(validation.message);
                    return;
                }
            }

            // Get product ID (fallback to 0 if not found, but we'll try to fetch)
            let productId = 0;
            const { data: prod } = await sb.from('products').select('id').eq('name', selectedPlan.name).eq('provider', selectedProvider).maybeSingle();
            if(prod) productId = prod.id;
            else {
                // Fallback: use plan amount_cents as product id? Not ideal. Better to create temp product.
                // We'll still proceed with 0, but RPC might fail. We'll assume product exists.
                console.warn('Product not found in DB, using 0');
            }

            // Create order using correct RPC
            const { data, error } = await sb.rpc('create_order', {
                p_product_id: productId,
                p_sender_phone: sender,
                p_receiver_phone: receiver,
                p_customer_id: currentUserId || null,
                p_promo_code: promo || null,
                p_payment_method: selectedPayment.name
            });
            if(error) {
                alert('Order khaldan: ' + error.message);
                return;
            }
            if(!data.success) {
                alert('Order khaldan: ' + (data.error || 'Unknown error'));
                return;
            }
            const ussd = selectedPayment.ussd_prefix + selectedPlan.amount_cents + '#';
            resultDiv.innerHTML = "✅ waad ku guulaysatay dalabkaagii, waana la keydiyey ee tuur la lacagta";
            resultDiv.style.display = "block";
            setTimeout(() => {
                window.location.href = `tel:${ussd}`;
            }, 3000);
        }

        // Event handlers
        next1.onclick = () => { loadServices(); showStep(2); };
        next2.onclick = () => { showStep(3); loadPlans(); };
        next3.onclick = () => { showStep(4); loadPaymentsAndSummary(); };
        back2.onclick = () => showStep(1);
        back3.onclick = () => showStep(2);
        back4.onclick = () => showStep(3);
        confirmBtn.onclick = createOrder;

        loadCompanies();
        showStep(1);
    })();
</script>
</body>
</html>
