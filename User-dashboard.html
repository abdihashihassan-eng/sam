<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SAHAN DATA - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: radial-gradient(circle at 10% 20%, rgba(61, 156, 224, 0.9), rgba(44, 82, 130, 0.95)); min-height: 100vh; padding: 1rem; }
        .glass-container { max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border-radius: 2rem; padding: 1.5rem; box-shadow: 0 25px 45px rgba(0,0,0,0.2); }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 2rem; background: linear-gradient(135deg, #FFF, #FFD966); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; background: rgba(0,0,0,0.4); padding: 0.5rem; border-radius: 2rem; }
        .nav-tabs a { background: white; color: #1e3c72; text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; transition: 0.2s; }
        .nav-tabs a:hover { background: #ffd966; }
        
        /* Wide cards, stacked vertically */
        .dashboard-stack { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; }
        .card h3 { color: #b45f06; border-bottom: 2px solid #ffd966; padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 1.3rem; }
        .info-row { display: flex; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid #f0e0c0; flex-wrap: wrap; }
        .info-label { font-weight: bold; color: #5a3e1b; width: 40%; font-size: 0.9rem; }
        .info-value { color: #2c2b28; width: 60%; font-weight: 500; word-break: break-word; }
        .badge { background: #ffd966; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: bold; color: #1e3c72; display: inline-block; }
        .rank-badge { background: #e69500; color: white; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.8rem; font-weight: bold; }
        .copy-btn { background: #e69500; border: none; border-radius: 1rem; padding: 0.2rem 0.6rem; color: white; cursor: pointer; font-size: 0.7rem; margin-left: 0.5rem; }
        .order-item, .referral-item { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #e2e8f0; }
        .loading { text-align: center; padding: 2rem; font-size: 1.1rem; }
        .logout-btn { background: #e69500; border: none; border-radius: 2rem; padding: 0.6rem 1.5rem; color: white; cursor: pointer; font-size: 0.9rem; display: inline-block; margin-top: 1rem; }
        .text-center { text-align: center; }
        .error-message { background: #fee2e2; color: #b91c1c; padding: 0.8rem; border-radius: 1rem; margin: 1rem 0; }
        @media (max-width: 700px) {
            .info-label, .info-value { width: 100%; }
            .info-value { margin-top: 0.3rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="glass-container">
    <div class="header">
        <h1><i class="fas fa-user-circle"></i> SAHAN DATA Dashboard</h1>
    </div>
    <div class="nav-tabs">
        <a href="index.html">Home</a> <a href="login.html">Login</a> <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a> <a href="admin.html">Admin</a> <a href="leaderboard.html">Leaderboard</a>
        <a href="rewards.html">Rewards</a> <a href="buyer.html">Buy</a> <a href="edit-profile.html">Edit Profile</a>
        <a href="order-history.html">Order History</a> <a href="referrals.html">Referrals</a>
        <a href="notifications.html">Notifications</a> <a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a>
        <a href="faq.html">FAQ</a> <a href="policy.html">Policy</a>
    </div>

    <div id="dashboardContent" class="loading">Loading your dashboard...</div>

    <div class="text-center">
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xccbmivhcbukqyplstae.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjY2JtaXZoY2J1a3F5cGxzdGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNTcyNTIsImV4cCI6MjA4NjkzMzI1Mn0.lGr3cDItP1-LVJgzd5wW5gp0HsGUonuZj-T9qGL2nF0';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let customerData = null;

    async function checkSession() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return null;
        }
        currentUser = session.user;
        return currentUser;
    }

    async function fetchCustomerByUid(uid) {
        const { data, error } = await sb.rpc('get_customer_by_uid', { p_uid: uid });
        if (error) throw error;
        return data?.[0] || null;
    }

    async function fetchReferralsCount(customerId) {
        const { data, error } = await sb.rpc('get_referrals_count', { p_customer_id: customerId });
        if (error) return 0;
        return data || 0;
    }

    async function fetchRecentOrders(customerId) {
        const { data, error } = await sb.rpc('get_recent_orders', { p_customer_id: customerId, p_limit: 5 });
        if (error) return [];
        return data || [];
    }

    async function fetchReferralsList(customerId) {
        const { data, error } = await sb.rpc('get_referrals_list', { p_customer_id: customerId, p_limit: 10 });
        if (error) return [];
        return data || [];
    }

    async function fetchOrderStats(customerId) {
        const { data, error } = await sb.from('orders').select('amount, created_at').eq('customer_id', customerId);
        if (error) return { totalOrders: 0, totalSpent: 0, lastOrderDate: null };
        const totalOrders = data.length;
        const totalSpent = data.reduce((sum, o) => sum + (o.amount || 0), 0);
        const lastOrder = data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
        const lastOrderDate = lastOrder ? new Date(lastOrder.created_at).toLocaleDateString() : null;
        return { totalOrders, totalSpent, lastOrderDate };
    }

    // Ranking functions
    async function fetchRankOverall(customerId) {
        try {
            const { data, error } = await sb.rpc('get_user_rank_overall', { p_customer_id: customerId });
            if (error) throw error;
            return data || 'N/A';
        } catch(e) { return 'N/A'; }
    }

    async function fetchRankDistrict(customerId, district) {
        try {
            const { data, error } = await sb.rpc('get_user_rank_district', { p_customer_id: customerId, p_district: district });
            if (error) throw error;
            return data || 'N/A';
        } catch(e) { return 'N/A'; }
    }

    async function fetchRankGroup(customerId, groupCode) {
        try {
            const { data, error } = await sb.rpc('get_user_rank_group', { p_customer_id: customerId, p_group_code: groupCode });
            if (error) throw error;
            return data || 'N/A';
        } catch(e) { return 'N/A'; }
    }

    async function fetchRankSchool(customerId, school) {
        try {
            const { data, error } = await sb.rpc('get_user_rank_school', { p_customer_id: customerId, p_school: school });
            if (error) throw error;
            return data || 'N/A';
        } catch(e) { return 'N/A'; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.copyToClipboard = function(text) {
        navigator.clipboard.writeText(text);
        alert('Copied: ' + text);
    };

    window.copyShareLink = function(refCode) {
        const baseUrl = window.location.origin;
        const shareUrl = `${baseUrl}/register.html?ref=${refCode}`;
        navigator.clipboard.writeText(shareUrl);
        alert('Share link copied: ' + shareUrl);
    };

    async function loadDashboard() {
        const container = document.getElementById('dashboardContent');
        try {
            const user = await checkSession();
            if (!user) return;

            customerData = await fetchCustomerByUid(user.id);
            if (!customerData) {
                container.innerHTML = `<div class="error-message">⚠️ No customer record found. Please register first.</div>`;
                return;
            }

            const referralCount = await fetchReferralsCount(customerData.id);
            const recentOrders = await fetchRecentOrders(customerData.id);
            const referralsList = await fetchReferralsList(customerData.id);
            const orderStats = await fetchOrderStats(customerData.id);
            
            // Fetch rankings
            const rankOverall = await fetchRankOverall(customerData.id);
            const rankDistrict = await fetchRankDistrict(customerData.id, customerData.district);
            const rankGroup = await fetchRankGroup(customerData.id, customerData.group_code);
            const rankSchool = await fetchRankSchool(customerData.id, customerData.school);

            const memberSince = customerData.created_at ? new Date(customerData.created_at).toLocaleDateString() : 'N/A';
            const freePackageClaimed = customerData.free_package_claimed ? new Date(customerData.free_package_claimed).toLocaleDateString() : 'Not claimed';

            container.innerHTML = `
                <!-- CARD 1: Personal Info + Rankings -->
                <div class="dashboard-stack">
                    <div class="card">
                        <h3><i class="fas fa-user"></i> Personal Information & Rankings</h3>
                        <div class="info-row"><span class="info-label">Full Name:</span><span class="info-value">${escapeHtml(customerData.full_name)}</span></div>
                        <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${escapeHtml(customerData.phone_number)}</span></div>
                        <div class="info-row"><span class="info-label">Email:</span><span class="info-value">${escapeHtml(customerData.email || 'Not provided')}</span></div>
                        <div class="info-row"><span class="info-label">District:</span><span class="info-value">${escapeHtml(customerData.district)}</span></div>
                        <div class="info-row"><span class="info-label">School:</span><span class="info-value">${escapeHtml(customerData.school)}</span></div>
                        <div class="info-row"><span class="info-label">Group Code:</span><span class="info-value"><span class="badge">${escapeHtml(customerData.group_code)}</span></span></div>
                        <div class="info-row"><span class="info-label">Member Since:</span><span class="info-value">${memberSince}</span></div>
                        <div class="info-row"><span class="info-label">Account Status:</span><span class="info-value"><span class="badge" style="background:#28a745; color:white;">Active</span></span></div>
                        <div class="info-row"><span class="info-label">Free Package Claimed:</span><span class="info-value">${freePackageClaimed}</span></div>
                        <div class="info-row"><span class="info-label">🏆 Overall Rank (all users):</span><span class="info-value"><span class="rank-badge">#${rankOverall}</span></span></div>
                        <div class="info-row"><span class="info-label">🏘️ District Rank (${escapeHtml(customerData.district)}):</span><span class="info-value"><span class="rank-badge">#${rankDistrict}</span></span></div>
                        <div class="info-row"><span class="info-label">👥 Group Rank (${escapeHtml(customerData.group_code)}):</span><span class="info-value"><span class="rank-badge">#${rankGroup}</span></span></div>
                        <div class="info-row"><span class="info-label">🏫 School Rank (${escapeHtml(customerData.school)}):</span><span class="info-value"><span class="rank-badge">#${rankSchool}</span></span></div>
                    </div>
                    
                    <!-- CARD 2: Rewards & Stats -->
                    <div class="card">
                        <h3><i class="fas fa-chart-line"></i> Rewards & Stats</h3>
                        <div class="info-row"><span class="info-label">🎁 Bonus Points:</span><span class="info-value"><strong>${customerData.bonus_points || 0}</strong></span></div>
                        <div class="info-row"><span class="info-label">🔗 Referral Code:</span><span class="info-value"><span class="badge">${escapeHtml(customerData.referral_code)}</span> <button class="copy-btn" onclick="copyToClipboard('${customerData.referral_code}')"><i class="fas fa-copy"></i> Copy</button></span></div>
                        <div class="info-row"><span class="info-label">🏷️ Promo Code:</span><span class="info-value"><span class="badge">${escapeHtml(customerData.promo_code)}</span></span></div>
                        <div class="info-row"><span class="info-label">👥 Total Referrals:</span><span class="info-value"><strong>${referralCount}</strong></span></div>
                        <div class="info-row"><span class="info-label">💰 Commission Earned:</span><span class="info-value"><strong>$${(referralCount * 0.5).toFixed(2)}</strong></span></div>
                        <div class="info-row"><span class="info-label">📦 Total Orders:</span><span class="info-value"><strong>${orderStats.totalOrders}</strong></span></div>
                        <div class="info-row"><span class="info-label">💰 Total Spent:</span><span class="info-value"><strong>$${orderStats.totalSpent.toFixed(2)}</strong></span></div>
                        <div class="info-row"><span class="info-label">📅 Last Order:</span><span class="info-value">${orderStats.lastOrderDate || 'No orders yet'}</span></div>
                        <div class="info-row"><span class="info-label">🎯 Next Reward Target:</span><span class="info-value">${Math.max(0, 100 - (customerData.bonus_points || 0))} more points</span></div>
                        <div class="info-row"><span class="info-label">🔗 Share your link:</span><span class="info-value"><button class="copy-btn" onclick="copyShareLink('${customerData.referral_code}')"><i class="fas fa-share-alt"></i> Copy Link</button></span></div>
                    </div>
                    
                    <!-- CARD 3: Recent Orders & Referrals -->
                    <div class="card">
                        <h3><i class="fas fa-shopping-cart"></i> Recent Orders</h3>
                        ${recentOrders.length === 0 ? '<p>No orders yet. <a href="buyer.html" style="color:#b45f06;">Buy data now →</a></p>' : recentOrders.map(order => `
                            <div class="order-item">
                                <span><i class="fas fa-receipt"></i> ${escapeHtml(order.order_number)}</span>
                                <span>$${order.amount}</span>
                                <span>${new Date(order.created_at).toLocaleDateString()}</span>
                            </div>
                        `).join('')}
                        ${recentOrders.length >= 5 ? '<div class="text-center" style="margin-top:0.5rem;"><a href="order-history.html" style="color:#b45f06;">View all orders →</a></div>' : ''}
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-users"></i> People You Referred</h3>
                        ${referralsList.length === 0 ? '<p>No referrals yet. Share your referral code!</p>' : referralsList.map(ref => `
                            <div class="referral-item">
                                <span><i class="fas fa-user-check"></i> ${escapeHtml(ref.full_name)}</span>
                                <span>${escapeHtml(ref.phone_number)}</span>
                                <span>${new Date(ref.created_at).toLocaleDateString()}</span>
                            </div>
                        `).join('')}
                        ${referralsList.length >= 10 ? '<div class="text-center" style="margin-top:0.5rem;"><a href="referrals.html" style="color:#b45f06;">View all referrals →</a></div>' : ''}
                    </div>
                </div>
            `;
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="error-message">⚠️ Error loading dashboard: ${err.message}</div>`;
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    loadDashboard();
</script>
</body>
</html>
